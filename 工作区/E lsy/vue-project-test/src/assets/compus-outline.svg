<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 大屏科技风渐变背景 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- 水系发光渐变 -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- 园区陆地渐变 -->
    <linearGradient id="land-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <!-- 赛博朋克网格纹理 -->
    <pattern id="cyber-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#1f293d" stroke-width="0.3" />
    </pattern>

    <!-- 发光滤镜 -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 铺满全屏的深色背景与网格 -->
  <rect width="100" height="100" fill="url(#bg-grad)" />
  <rect width="100" height="100" fill="url(#cyber-grid)" />

  <!-- 2. 模拟外围水系 (右下角与左下角) -->
  <path d="M 0 50 Q 20 60 40 100 L 0 100 Z" fill="url(#water-grad)" />
  <path d="M 60 100 Q 80 80 100 50 L 100 100 Z" fill="url(#water-grad)" />
  <!-- 水系边界装饰线 -->
  <path d="M 0 50 Q 20 60 40 100" fill="none" stroke="#0ea5e9" stroke-width="0.5" filter="url(#neon-glow)" />
  <path d="M 60 100 Q 80 80 100 50" fill="none" stroke="#0ea5e9" stroke-width="0.5" filter="url(#neon-glow)" />

  <!-- 3. 园区陆地主轮廓 (根据 YAML 坐标的大致边界勾勒，注意 SVG 的 Y 轴是向下的，所以我做了视觉反转映射) -->
  <!-- 左极点(8,45), 上极点(45,20), 右极点(92,45), 下极点(65,95) -->
  <path d="M 45 10 
           C 65 10, 85 25, 95 45 
           C 98 60, 85 85, 65 95 
           C 40 95, 20 80, 5 45 
           C 0 25, 25 10, 45 10 Z" 
        fill="url(#land-grad)" 
        stroke="#3b82f6" 
        stroke-width="0.6" 
        stroke-dasharray="2, 1"
        filter="url(#neon-glow)" />

  <!-- 4. 内部核心主干道点缀线 (提升科技感) -->
  <path d="M 45 10 L 45 95 M 5 45 L 95 45" fill="none" stroke="#334157" stroke-width="0.4" stroke-dasharray="1, 1" />
  
  <!-- 5. 装饰环 -->
  <circle cx="45" cy="45" r="15" fill="none" stroke="#475569" stroke-width="0.2" />
  <circle cx="45" cy="45" r="30" fill="none" stroke="#475569" stroke-width="0.1" stroke-dasharray="0.5, 1" />
</svg>
